name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        database: ['mysql:8.0', 'mariadb:10.11']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: simplemspdoc_test
          MARIADB_ROOT_PASSWORD: testing
          MARIADB_DATABASE: simplemspdoc_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --password=testing || mariadb-admin ping -h 127.0.0.1 --password=testing"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, dom, fileinfo, openssl, curl, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find index.php src templates database scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
        env:
          TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=simplemspdoc_test;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASSWORD: testing
      - run: php scripts/build-release.php 2.0.0-alpha.2
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleMSPDoc-php-${{ matrix.php }}-${{ strategy.job-index }}
          path: dist/*.zip
      - name: Packaged Apache fresh installation
        if: matrix.php == '8.3' && matrix.database == 'mariadb:10.11'
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 libapache2-mod-php8.3 php8.3-mysql php8.3-mbstring php8.3-xml php8.3-zip
          sudo a2dismod rewrite || true
          sudo mkdir -p /var/www/simplemspdoc
          sudo unzip -q dist/SimpleMSPDoc-2.0.0-alpha.2.zip -d /var/www/simplemspdoc
          sudo chown -R www-data:www-data /var/www/simplemspdoc/data
          sudo cp tests/Browser/apache-ci.conf /etc/apache2/sites-available/simplemspdoc.conf
          sudo a2dissite 000-default
          sudo a2ensite simplemspdoc
          sudo apache2ctl configtest
          sudo systemctl restart apache2
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306","root","testing");$p->exec("CREATE DATABASE simplemspdoc_apache_test CHARACTER SET utf8mb4");'
          sudo env BASE_URL=http://127.0.0.1 INSTALL_ROOT=/var/www/simplemspdoc python3 tests/Browser/apache-smoke.py
      - name: Browser acceptance
        if: matrix.php == '8.3' && matrix.database == 'mariadb:10.11'
        run: |
          npm install --prefix /tmp/simplemspdoc-browser-tools playwright
          node /tmp/simplemspdoc-browser-tools/node_modules/playwright/cli.js install --with-deps chromium
          mkdir -p browser-screenshots
          NODE_PATH=/tmp/simplemspdoc-browser-tools/node_modules SCREENSHOT_DIR="$PWD/browser-screenshots" php tests/Browser/run.php
        env:
          TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=simplemspdoc_test;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASSWORD: testing
      - uses: actions/upload-artifact@v4
        if: always() && matrix.php == '8.3' && matrix.database == 'mariadb:10.11'
        with:
          name: browser-screenshots
          path: browser-screenshots/*.png
